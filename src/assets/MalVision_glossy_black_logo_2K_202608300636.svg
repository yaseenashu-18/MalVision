<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Glossy Black 3D Gradient -->
    <linearGradient id="glossyBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333336" />
      <stop offset="40%" stop-color="#111113" />
      <stop offset="70%" stop-color="#000000" />
      <stop offset="100%" stop-color="#222225" />
    </linearGradient>

    <!-- Glossy Red 3D Gradient for Vision -->
    <linearGradient id="glossyRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="75%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Metallic Reflection Highlight -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Elegant Cursive Script MalVision Vector Text -->
    <text x="20" y="115" font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', 'Caveat', 'Segoe Script', cursive, sans-serif" font-size="105" font-weight="bold" letter-spacing="-1.5">
      <tspan fill="url(#glossyBlack)" stroke="#000000" stroke-width="1.5">Mal</tspan><tspan fill="url(#glossyRed)" stroke="#7f1d1d" stroke-width="1.5">Vision</tspan>
    </text>
  </g>
</svg>
